<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM System</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
}

.container{
    width:350px;
    margin:50px auto;
    padding:20px;
    background:white;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
    text-align:center;
}

input{
    width:90%;
    padding:10px;
    margin:10px 0;
}

button{
    padding:10px 15px;
    margin:5px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="container">

<h2>ATM System</h2>

<input type="number" id="amount" placeholder="Enter Amount">

<br>

<!-- money put into a bank -->
<button id="deposit">Deposit</button>
<!-- taking money out of a bank account, -->
<button id="withdraw">Withdraw</button>

<br><br>

<button id="balance">Check Balance</button>
<button id="clear">Clear</button>

<div id="result"></div>

</div>

<script>

let balance = 5000;

// Deposit
document.getElementById("deposit").addEventListener("click", function(){

    let amount = Number(document.getElementById("amount").value);

    if(document.getElementById("amount").value==""){
        document.getElementById("result").innerHTML="Please enter amount.";
    }
    else if(amount<=0){
        document.getElementById("result").innerHTML="Enter valid amount.";
    }
    else{

        balance = balance + amount;

        document.getElementById("result").innerHTML=
        "Amount Deposited : " + amount +
        "<br>Current Balance : " + balance;

    }

});


// Withdraw
document.getElementById("withdraw").addEventListener("click", function(){

    let amount = Number(document.getElementById("amount").value);

    if(document.getElementById("amount").value==""){
        document.getElementById("result").innerHTML="Please enter amount.";
    }
    else if(amount<=0){
        document.getElementById("result").innerHTML="Enter valid amount.";
    }
    else if(amount>balance){

        document.getElementById("result").innerHTML="Insufficient Balance!";

    }
    else{

        balance = balance - amount;

        document.getElementById("result").innerHTML=
        "Amount Withdrawn : " + amount +
        "<br>Current Balance : " + balance;

    }

});


// Check Balance
document.getElementById("balance").addEventListener("click", function(){

    document.getElementById("result").innerHTML=
    "Current Balance : " + balance;

});


// Clear
document.getElementById("clear").addEventListener("click", function(){

    document.getElementById("amount").value="";
    document.getElementById("result").innerHTML="";

});

</script>

</body>
</html>
